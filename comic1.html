<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComicCraft - AI Comic Story Creator</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #7c3aed, #db2777);
      padding: 25px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
    }

    header p {
      margin-top: 8px;
      opacity: 0.9;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #334155;
      color: white;
      margin-bottom: 18px;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: white;
      border: none;
      padding: 14px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    #loading {
      display: none;
      text-align: center;
      padding: 15px;
      color: #c4b5fd;
    }

    .comic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .panel {
      background: #f8fafc;
      color: #111827;
      border: 5px solid #111827;
      border-radius: 8px;
      min-height: 300px;
      padding: 15px;
      position: relative;
      box-shadow: 6px 6px 0 #000;
    }

    .panel-number {
      background: #111827;
      color: white;
      padding: 6px 10px;
      display: inline-block;
      margin-bottom: 12px;
      border-radius: 5px;
      font-weight: bold;
    }

    .panel h3 {
      margin-bottom: 12px;
      color: #7c3aed;
    }

    .scene {
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .dialogue {
      background: #fff;
      border: 2px solid #111827;
      padding: 12px;
      border-radius: 50%;
      text-align: center;
      font-weight: bold;
      margin-top: 20px;
    }

    .empty {
      text-align: center;
      color: #94a3b8;
      padding: 30px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

<header>
  <h1>🎨 ComicCraft</h1>
  <p>AI Comic Story Creator using Gemini Models</p>
</header>

<div class="container">

  <div class="card">
    <h2>✨ Create Your Comic</h2>
    <br>

    <label>Comic Title</label>
    <input
      type="text"
      id="title"
      placeholder="Example: The Last Superhero"
    >

    <label>Story Idea</label>
    <textarea
      id="story"
      placeholder="Enter your story idea..."
    ></textarea>
